<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14100E">
<title>Forja · Gerenciador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<script src="config.js" onerror="void 0"></script>
<style>
/* Forja · Gerenciador v1.5 · interface no padrão do Meu Dia (v.08 leve + v.13 relatório) */
:root{
  --ferro:#14100E;--aco:#3A3532;--escoria:#6E6663;--brasa:#D4500F;--chama:#F07A1E;--faisca:#FFC24A;--temperado:#2F5D3A;--cal:#F2F0ED;
  --bg:#F5F3F0;--card:#FFFFFF;--surf:#EFECE8;--surf2:#E5E0DB;--ink:#14100E;--ink2:#3A3532;--ink3:#6E6663;
  --rule:rgba(20,16,14,.08);--trilho:#D9D2CB;--acento:#D4500F;--ok:#2F5D3A;--alertabg:#FFC24A;--alerta:#8A6100;
  --tile:#14100E;--hdr:rgba(245,243,240,.86);--navbg:rgba(255,255,255,.92);--acc-soft:rgba(212,80,15,.11);
  --r:20px;--r2:14px;--sh:0 1px 2px rgba(20,16,14,.04),0 8px 24px -14px rgba(20,16,14,.18);color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.trava{overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3{margin:0;font-family:var(--f-b);font-weight:700;letter-spacing:-.02em;line-height:1.15}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
a{color:inherit}
button{cursor:pointer;font-family:inherit}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#load{position:fixed;top:0;left:0;height:3px;width:0;background:var(--acento);z-index:80;transition:width .25s}

/* cabeçalho */
.capa{position:sticky;top:0;z-index:20;background:var(--hdr);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
.capa .lin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.marca{display:block;flex:none;line-height:0}
.marca svg{width:38px;height:38px;display:block}
.marca svg rect{fill:var(--tile)}
.tt{flex:1;min-width:0}
.tt .kk{font-size:12px;font-weight:600;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt h1{font-size:clamp(20px,5.6vw,26px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dir{display:flex;align-items:center;gap:8px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 12px;font-size:12.5px;font-weight:700;text-decoration:none;background:var(--card);border:1px solid var(--rule);color:var(--ink2)}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pill.at::before{background:var(--alertabg)}.pill.cr::before{background:var(--brasa)}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:var(--surf);color:var(--ink2);display:grid;place-items:center}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{background:var(--surf2)}

/* página */
.wrap{max-width:720px;margin:0 auto;padding:8px 16px 190px}
section{animation:entra .2s ease-out}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h3{font-size:15px;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h3::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acento)}
h3.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:700}
h3.sec::before{display:none}
.nota{font-size:13px;color:var(--ink3);font-family:"Source Serif 4",Georgia,serif;line-height:1.45}
.cd{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink3)}
.voltar{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px;color:var(--acento);text-decoration:none;margin:4px 0 10px;min-height:40px}
.card{background:var(--card);border:1px solid var(--rule);box-shadow:var(--sh);border-radius:var(--r);padding:14px;margin-top:12px;min-width:0}
.card>h3:first-child{margin-top:0}
.vazio{padding:22px 14px;text-align:center;color:var(--ink3);font-size:14.5px;border:1px dashed var(--rule);border-radius:var(--r);margin-top:12px}
.vazio .bt{margin-top:10px}

/* botões e campos */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:var(--r2);border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;text-decoration:none;white-space:nowrap}
.bt:active{transform:scale(.97)}
.bt.pri{background:var(--brasa);color:#fff}
.bt.sec{background:var(--surf);color:var(--ink)}
.bt.perigo{background:transparent;color:var(--acento);box-shadow:inset 0 0 0 1.5px var(--acento)}
.bt.mini{min-height:34px;padding:6px 12px;font-size:13px;border-radius:12px}
.bt.cheio{width:100%;min-height:52px;border-radius:16px;font-size:15px}
.bt[disabled]{opacity:.4;cursor:not-allowed}
label.f{display:block;font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:12px;letter-spacing:.01em}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;background:var(--surf);border:0;border-radius:var(--r2);padding:10px 12px;min-height:46px;font-family:var(--f-b);font-size:16px;color:var(--ink);font-weight:500;-webkit-appearance:none;appearance:none}
label.f select{background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),linear-gradient(135deg,var(--ink3) 50%,transparent 50%);background-position:calc(100% - 18px) 52%,calc(100% - 13px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
label.f textarea{min-height:110px;resize:vertical;font-family:"Source Serif 4",Georgia,serif;line-height:1.5}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:0;box-shadow:0 0 0 2.5px var(--acento)}
label.f.erro input,label.f.erro select,label.f.erro textarea{box-shadow:0 0 0 2px var(--brasa)}
label.f .msg{display:none;color:var(--acento);font-size:12.5px;margin-top:4px;font-weight:600}
label.f.erro .msg{display:block}
label.f .nota{display:block;margin-top:3px;font-weight:400}
.grade{display:grid;gap:0 12px;grid-template-columns:1fr}
@media (min-width:560px){.grade{grid-template-columns:1fr 1fr}}
.busca{width:100%;min-height:46px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r2);padding:10px 14px;font-size:16px;color:var(--ink);font-family:inherit;-webkit-appearance:none;box-shadow:var(--sh)}
.busca:focus{outline:0;box-shadow:0 0 0 2.5px var(--acento)}
select.sel{background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:9px 14px;min-height:40px;font-size:14px;font-weight:700;color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none;max-width:100%}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.seg-ctl{display:inline-flex;background:var(--surf);border-radius:14px;padding:3px;gap:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg-ctl::-webkit-scrollbar{display:none}
.seg-ctl button{border:0;background:transparent;border-radius:11px;padding:8px 14px;font-size:13px;font-weight:700;color:var(--ink3);white-space:nowrap;min-height:36px}
.seg-ctl button.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surf);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok);color:#fff}.chip.at{background:var(--alertabg);color:#14100E}.chip.cr{background:var(--brasa);color:#fff}.chip.sf{background:var(--acc-soft);color:var(--acento)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--trilho);flex:none}
.dot.ok{background:var(--ok)}.dot.at{background:var(--alertabg)}.dot.cr{background:var(--brasa)}

/* listas */
.lista{background:var(--card);border:1px solid var(--rule);box-shadow:var(--sh);border-radius:var(--r);padding:2px 14px;margin-top:10px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--rule);min-width:0}
.row:first-child{border-top:0}
.row.lk{cursor:pointer}
.row.lk:active{background:var(--acc-soft)}
.row .nm{font-weight:700;font-size:15.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.row .sb{font-size:13px;color:var(--ink3);line-height:1.35;margin-top:1px}
.row .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.av{width:42px;height:42px;border-radius:13px;background:var(--surf);display:grid;place-items:center;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:13px;color:var(--ink2);position:relative}
.av i{position:absolute;right:-2px;top:-2px;width:11px;height:11px;border-radius:50%;border:2px solid var(--card);background:var(--trilho)}
.av i.at{background:var(--alertabg)}.av i.cr{background:var(--brasa)}.av i.ok{background:var(--ok)}
.caixa{-webkit-appearance:none;appearance:none;width:26px;height:26px;border:2px solid var(--ink3);border-radius:9px;background:transparent;margin:0;display:grid;place-items:center;flex:none;cursor:pointer}
.caixa:checked{background:var(--ok);border-color:var(--ok)}
.caixa:checked::after{content:"";width:11px;height:6px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.go{color:var(--ink3);font-size:22px;line-height:1;text-decoration:none;padding:6px}
.acoes-l{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* indicadores */
.bi-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
@media (min-width:600px){.bi-kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bi-kpi{background:var(--card);border:1px solid var(--rule);box-shadow:var(--sh);border-radius:var(--r);padding:12px 12px 10px;display:grid;gap:2px;text-align:left;color:var(--ink);align-content:start;min-width:0;position:relative;min-height:104px;font-family:inherit;width:100%}
.bi-kpi::after{content:"";position:absolute;top:13px;right:13px;width:8px;height:8px;border-radius:50%;background:var(--trilho)}
.bi-kpi.ok::after{background:var(--ok)}.bi-kpi.at::after{background:var(--alertabg)}.bi-kpi.cr::after{background:var(--brasa)}
.bi-kpi:active{transform:scale(.98)}
.bi-kn{font-size:12px;font-weight:600;color:var(--ink3);line-height:1.25;padding-right:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bi-kv{font-weight:700;font-size:25px;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.bi-kd{font-size:11.5px;font-weight:700;color:var(--ink3)}
.bi-kpi.ok .bi-kd{color:var(--ok)}.bi-kpi.cr .bi-kd{color:var(--acento)}.bi-kpi.at .bi-kd{color:var(--alerta)}
.bi-kpi.cr .bi-kv{color:var(--acento)}
.mais-l{display:flex;width:100%;justify-content:center;align-items:center;background:none;border:0;padding:12px 0 2px;font-weight:700;font-size:13px;color:var(--acento);min-height:44px}

/* funil, barras, gráfico */
.fn{display:grid;grid-template-columns:116px 1fr 74px;gap:10px;align-items:center;margin:7px 0;font-size:13.5px;font-weight:600}
.fn .b{height:10px;background:var(--surf);border-radius:99px;overflow:hidden}
.fn .b i{display:block;height:100%;background:var(--ink2);border-radius:99px}
.fn .n{text-align:right;font-weight:700;font-size:13px}
.fn .n small{color:var(--ink3);font-weight:600}
.graf{width:100%;height:auto;display:block}
.graf text{font-family:var(--f-b);font-size:10px;fill:var(--ink3)}
.graf text.vv{font-size:11px;font-weight:700;fill:var(--ink)}
.graf rect.b1{fill:var(--ink3)}.graf rect.b2{fill:var(--acento)}
.mini3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.mini3 div{background:var(--surf);border-radius:12px;padding:8px 10px;display:grid;gap:1px}
.mini3 span{font-size:11px;font-weight:600;color:var(--ink3)}
.mini3 b{font-size:18px}
.env{padding:10px 0;border-top:1px solid var(--rule);display:grid;gap:6px}
.env:first-of-type{border-top:0}
.env .en{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
.env .tr{position:relative;height:8px;border-radius:99px;background:var(--surf);display:block}
.env .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--ink3)}
.env .tr i.ok{background:var(--ok)}.env .tr i.at{background:var(--alertabg)}.env .tr i.cr{background:var(--brasa)}
.env .tr u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);margin-left:-1px}

/* kanban */
.kan{display:flex;gap:10px;overflow-x:auto;padding:2px 0 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}
.col{flex:0 0 240px;background:var(--surf);border-radius:var(--r);padding:10px;scroll-snap-align:start}
.col h3{display:flex;justify-content:space-between;font-size:12.5px;margin:0 0 8px}
.col h3::before{display:none}
.kc{background:var(--card);border:1px solid var(--rule);border-radius:var(--r2);padding:10px 12px;margin-bottom:8px;box-shadow:var(--sh);position:relative}
.kc.at{box-shadow:inset 4px 0 0 var(--alertabg),var(--sh)}.kc.cr{box-shadow:inset 4px 0 0 var(--brasa),var(--sh)}
.kc .mv{display:flex;justify-content:space-between;margin-top:8px}

/* abas de página (v.13) */
.pags{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:0 16px;border-bottom:1px solid var(--rule);position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:5;background:var(--bg)}
.pags::-webkit-scrollbar{display:none}
.pags button{flex:0 0 auto;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:12px 12px 10px;font-weight:700;font-size:14px;color:var(--ink3);min-height:44px}
.pags button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--acento)}
.tl{margin-top:4px}
.tli{position:relative;padding:0 0 14px 20px;border-left:2px solid var(--rule);margin-left:6px}
.tli::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--ink3)}
.tli.pl::before{background:var(--alertabg)}.tli.fe::before{background:var(--ok)}.tli.ca::before{background:var(--trilho)}
.tli:last-child{border-left-color:transparent}
.savebar{position:fixed;left:50%;transform:translateX(-50%);width:min(720px,100%);padding:0 16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:25}
.savebar .bt{box-shadow:0 10px 26px -8px rgba(20,16,14,.5)}

/* pitches */
.pit{background:var(--card);border:1px solid var(--rule);box-shadow:var(--sh);border-radius:var(--r);padding:14px;margin-top:10px}
.ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph b{font-size:15px;flex:1;min-width:140px}
.ordem{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 8px;font-weight:600}
.pit .tx{white-space:pre-wrap;font-family:"Source Serif 4",Georgia,serif;font-size:15.5px;line-height:1.55;margin:10px 0;background:var(--surf);border-radius:var(--r2);padding:12px}
.pit .tx mark{background:var(--alertabg);color:#14100E;padding:0 4px;border-radius:5px}
.pa{display:flex;gap:6px;flex-wrap:wrap}
.ordb{display:flex;gap:4px}
.ordb .bt{min-width:34px;padding:6px 0}
.etapas{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:12px -16px 0;padding:2px 16px}
.etapas::-webkit-scrollbar{display:none}
.etapas button{flex:0 0 auto;border:0;background:var(--surf);border-radius:999px;padding:9px 14px;font-size:13px;font-weight:700;color:var(--ink2);min-height:38px}
.etapas button.on{background:var(--ink);color:var(--bg)}

/* conteúdo */
.dd{width:46px;text-align:center;font-family:"IBM Plex Mono",monospace;line-height:1.2}
.dd b{display:block;font-size:15px}.dd span{font-size:11px;color:var(--ink3)}
.tiles{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:2px 16px 4px}
.tiles::-webkit-scrollbar{display:none}
.tiles div{flex:0 0 auto;min-width:104px;background:var(--card);border:1px solid var(--rule);border-radius:var(--r2);padding:10px 12px;box-shadow:var(--sh)}
.tiles span{display:block;font-size:11.5px;font-weight:600;color:var(--ink3)}
.tiles b{font-size:22px}

/* barra inferior, FAB, folha, toast */
.tabbar{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--navbg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--rule);border-radius:26px;box-shadow:var(--sh);padding:6px}
@media (min-width:700px){.tabbar{left:50%;right:auto;width:560px;transform:translateX(-50%)}}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 0 7px;border-radius:20px;color:var(--ink3);text-decoration:none;font-size:10.5px;font-weight:600;position:relative;min-height:52px}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linejoin:round;stroke-linecap:round}
.tabbar a.on{color:var(--acento);background:var(--acc-soft)}
.tabbar a .pn{position:absolute;top:4px;right:calc(50% - 20px);min-width:17px;height:17px;border-radius:99px;background:var(--brasa);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.fab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:31;height:52px;padding:0 20px 0 16px;border:0;border-radius:26px;background:var(--brasa);color:#fff;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;box-shadow:0 10px 26px -8px rgba(20,16,14,.55)}
.fab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
.fab:active{transform:scale(.95)}
@media (min-width:900px){.fab{right:calc(50% - 360px)}}
#modal{position:fixed;inset:0;z-index:60;background:rgba(20,16,14,.55);display:none;align-items:flex-end;justify-content:center;animation:fade .18s}
#modal.on{display:flex}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));animation:sobe .22s ease-out;overscroll-behavior:contain}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:28px}}
@keyframes sobe{from{transform:translateY(40px);opacity:.6}}
.alca{display:grid;place-items:center;height:24px}
.alca i{width:44px;height:5px;border-radius:99px;background:var(--trilho)}
.sheet h2{font-size:20px;margin:0 0 12px}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap}
.macts .bt{flex:1;min-width:110px}
.acoes-rap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acao{background:var(--card);border:1px solid var(--rule);border-radius:var(--r);text-align:left;padding:14px 12px;display:grid;gap:2px;color:var(--ink);box-shadow:var(--sh)}
.acao b{font-size:16px}.acao span{font-size:12.5px;color:var(--ink3)}
.acao.quente{box-shadow:inset 3px 0 0 var(--brasa),var(--sh)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(160px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:6px;width:min(92vw,440px);pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:999px;font-size:14.5px;font-weight:600;text-align:center;animation:entra .2s}
.toast.err{box-shadow:inset 0 0 0 2px var(--brasa)}

/* login */
.pw{display:flex;gap:8px;align-items:center}.pw input{flex:1;min-width:0}.pw .bt{flex:0 0 auto}
.conta{display:flex;align-items:center;gap:14px;padding:16px}.conta .av{width:48px;height:48px;font-size:17px}
.login{max-width:420px;margin:0 auto;padding:calc(10vh + env(safe-area-inset-top,0px)) 16px 40px}
.login .ident{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.login .ident svg{width:48px;height:48px;display:block}
.login .ident svg rect{fill:var(--tile)}
.login h1{font-size:28px}
.login .card{padding:18px}
.rodape{margin-top:28px;color:var(--ink3);font-size:11.5px;font-family:"IBM Plex Mono",monospace}
@media print{.capa,.tabbar,.fab,.savebar{display:none}}

/* ===== v1.4 · PELE FORJA · mesma pele das páginas de campo (forja.css v.01) e da planilha =====
   Ferro e Cal ~70% · Aço e Escória ~25% · laranjas ≤5%. Temperado = no padrão · Faísca = atenção · Brasa = crítico.
   Arestas retas, canto inferior direito cortado, zero arredondado, zero sombra, zero degradê.
   Archivo Black (títulos) · Source Serif 4 (texto) · IBM Plex Mono (dado, rótulo). */
:root{
  --linha:#D8D3CE;--palha:#E6E1DC;--okbg:#DCE7DF;--atbg:#FBEBC2;--crbg:#F6D9CC;--faiscaesc:#7F6010;--sobre:#A79F99;
  --f-d:"Archivo Black","Arial Black","Helvetica Neue",Arial,sans-serif;--f-b:"Source Serif 4",Georgia,"Times New Roman",serif;--f-m:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --bg:#F2F0ED;--card:#FFFFFF;--surf:#E6E1DC;--surf2:#D8D3CE;--ink:#14100E;--ink2:#3A3532;--ink3:#6E6663;--rule:#D8D3CE;--trilho:#D8D3CE;
  --acento:#D4500F;--ok:#2F5D3A;--alertabg:#FFC24A;--alerta:#7F6010;--tile:#14100E;--acc-soft:#E6E1DC;--corte:12px;color-scheme:light}
*,*::before,*::after{border-radius:0!important;box-shadow:none!important;text-shadow:none!important}
html,body{background:var(--bg)!important}
body{font-family:var(--f-b);font-size:17px;line-height:1.5}
:focus-visible{outline:3px solid var(--brasa)!important;outline-offset:2px!important}
.mono,.cd,.dd,.ordem,.av{font-family:var(--f-m)}
/* capa: faixa de Ferro com o fio de Brasa */
.capa{background:var(--ferro)!important;-webkit-backdrop-filter:none;backdrop-filter:none;border-bottom:3px solid var(--brasa);padding-top:calc(9px + env(safe-area-inset-top,0px));padding-bottom:9px}
.capa .tt .kk{font-family:var(--f-m);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--sobre)}
.capa .tt h1{font-family:var(--f-d);font-weight:400;font-size:clamp(15px,4.4vw,21px);text-transform:uppercase;letter-spacing:-.005em;color:var(--cal);line-height:1.1}
.capa .marca svg rect{fill:#2A2420}
.capa .pill{background:transparent;border:1px solid var(--escoria);color:var(--cal);font-family:var(--f-m);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px}
.capa .pill::before{border-radius:0;width:8px;height:8px;background:var(--temperado)}
.capa .pill.at::before{background:var(--faisca)}.capa .pill.cr::before{background:var(--brasa)}
.capa .ib{background:transparent;border:1px solid var(--escoria);color:var(--cal)}
/* títulos de bloco: barra de Ferro com a ponta de Chama */
h2{font-family:var(--f-d);font-weight:400;text-transform:uppercase}
#main h3{background:var(--ferro);color:var(--cal);padding:9px 12px;font-family:var(--f-d);font-weight:400;font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:24px 0 8px;display:flex;align-items:center;gap:10px}
#main h3::before{content:"";flex:none;width:10px;height:10px;background:var(--chama);clip-path:polygon(0 0,100% 0,0 100%)}
#main h3 small,#main h3 .cd{margin-left:auto;font-family:var(--f-m);font-weight:400;font-size:11px;letter-spacing:.08em;color:var(--sobre);text-transform:uppercase}
#main h3 .chip{margin-left:auto}
#main .card h3,#main .col h3,#main .pit h3{background:none;color:var(--ferro);padding:0;margin:0;font-size:14px;display:block}
#main .card h3::before,#main .col h3::before,#main .pit h3::before{content:none}
#main .col h3{display:flex;justify-content:space-between;font-family:var(--f-m);font-weight:600;font-size:12px;letter-spacing:.12em}
.nota,.lead{font-family:var(--f-b);font-size:14.5px;color:var(--escoria);line-height:1.45}
label.f{font-family:var(--f-m);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--escoria);font-weight:600}
.voltar{font-family:var(--f-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brasa)}
/* cartões e listas: topo de Ferro, canto inferior direito cortado */
.card,.lista,.pit,.acao,.vazio{background:var(--card);border:1px solid var(--linha);border-top:3px solid var(--ferro);clip-path:polygon(0 0,100% 0,100% calc(100% - var(--corte)),calc(100% - var(--corte)) 100%,0 100%)}
.vazio{border-style:solid;color:var(--escoria)}
.card.hoje{border-left:1px solid var(--linha)}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ch h3{margin:0}
.row{border-top:1px solid var(--linha)}
.row .nm{font-family:var(--f-b);font-weight:700;font-size:16.5px}
.row .sb{font-family:var(--f-b);font-size:14.5px;color:var(--escoria)}
.row.lk:active{background:var(--palha)}
.av{background:var(--ferro);color:var(--cal);font-size:12.5px;font-weight:600}
.av i{border:2px solid var(--card)}
.caixa{border:2px solid var(--aco);border-radius:0}
/* botões: canto inferior direito cortado */
.bt{background:var(--ferro);color:var(--cal);font-family:var(--f-m);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%)}
.bt:hover{background:var(--aco)}
.bt.pri{background:var(--brasa);color:#fff}
.bt.sec{background:transparent;color:var(--ferro);border:1px solid var(--aco)}
.bt.perigo{background:transparent;color:var(--brasa);border:1px solid var(--brasa)}
.bt.mini{font-size:11px;min-height:34px}
.bt.cheio{font-size:13px}
.bt:focus-visible{clip-path:none}
/* campos */
label.f input,label.f select,label.f textarea,.busca,select.sel{background:var(--card);border:1px solid var(--aco);font-family:var(--f-b);color:var(--ferro)}
label.f input:focus,label.f select:focus,label.f textarea:focus,.busca:focus{outline:3px solid var(--brasa)!important}
label.f.erro input,label.f.erro select,label.f.erro textarea{border-color:var(--brasa);border-width:2px}
select.sel{font-family:var(--f-m);font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.seg-ctl{background:var(--card);border:1px solid var(--aco);padding:0;gap:0}
.seg-ctl button{font-family:var(--f-m);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;border-left:1px solid var(--aco);color:var(--ferro)}
.seg-ctl button:first-child{border-left:0}
.seg-ctl button.on{background:var(--ferro);color:var(--cal)}
.etapas button{background:var(--card);border:1px solid var(--aco);font-family:var(--f-m);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ferro)}
.etapas button.on{background:var(--ferro);color:var(--cal)}
/* abas de página do cliente: aba ativa em Ferro com o fio de Brasa embaixo */
.pags{border-bottom:2px solid var(--ferro);background:var(--bg)}
.pags button{font-family:var(--f-m);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;color:var(--escoria)}
.pags button[aria-selected="true"]{background:var(--ferro);color:var(--cal);border-bottom-color:var(--brasa)}
/* chips de estado */
.chip{font-family:var(--f-m);font-size:11px;font-weight:600;letter-spacing:.03em;background:var(--palha);color:var(--escoria)}
.chip.ok{background:var(--okbg);color:var(--temperado)}.chip.at{background:var(--atbg);color:var(--faiscaesc)}.chip.cr{background:var(--crbg);color:var(--brasa)}.chip.sf{background:var(--ferro);color:var(--cal)}
.dot.ok{background:var(--temperado)}.dot.at{background:var(--faisca)}.dot.cr{background:var(--brasa)}
/* KPIs: barra de estado à esquerda (Temperado, Faísca, Brasa) */
.kg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:3px solid var(--ferro);border-left:1px solid var(--linha);background:var(--card);margin:8px 0 4px;clip-path:polygon(0 0,100% 0,100% calc(100% - var(--corte)),calc(100% - var(--corte)) 100%,0 100%)}
@media (min-width:640px){.kg{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kg .k{position:relative;padding:12px 12px 12px 16px;border:0;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);background:transparent;text-align:left;color:var(--ferro);min-width:0;display:grid;align-content:start;gap:2px;font-family:inherit;cursor:pointer}
.kg .k:active{background:var(--palha)}
.kg .k::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--linha)}
.kg .k.ok::before{background:var(--temperado)}.kg .k.at::before{background:var(--faisca)}.kg .k.cr::before{background:var(--brasa)}
.kg .l{font-family:var(--f-m);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--escoria);font-weight:600;min-height:30px;line-height:1.3}
.kg .v{font-family:var(--f-m);font-weight:600;font-size:30px;line-height:1.1;letter-spacing:-.02em;margin:4px 0 2px;white-space:nowrap;color:var(--ferro)}
.kg .k.cr .v{color:var(--brasa)}.kg .k.at .v{color:var(--faiscaesc)}.kg .k.ok .v{color:var(--temperado)}
.kg .d{font-family:var(--f-m);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--escoria)}
.kg .k.cr .d{color:var(--brasa)}.kg .k.at .d{color:var(--faiscaesc)}.kg .k.ok .d{color:var(--temperado)}
.mais-l{font-family:var(--f-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--brasa)}
/* funil, rosca, origem, barras: Aço, Brasa só no que decide, Temperado no fechamento */
.funil{display:grid;gap:12px}
.fn2{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-b);font-size:15.5px;font-weight:700;margin-bottom:4px}
.fn2 b{font-family:var(--f-m);font-size:15px}
.fn2 small{color:var(--escoria);font-weight:600;font-size:12px;margin-left:6px}
.fb{height:18px;background:var(--palha)}
.fb i{display:block;height:100%;background:var(--aco);min-width:3px}
.fb i.fim{background:var(--temperado)}
.funil .fl:first-child .fb i{background:var(--ferro)}
.funil .fl:nth-child(n+3):not(:last-child) .fb i{background:var(--aco)}
.bi-duo{display:grid;grid-template-columns:1fr;gap:0 12px}
@media (min-width:640px){.bi-duo{grid-template-columns:1fr 1fr}}
.dn-w{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.donut{width:128px;height:128px;flex:none}
.donut .dn{font-family:var(--f-m);font-weight:600;font-size:22px;fill:var(--ferro)}
.donut .dl{font-family:var(--f-m);font-size:8px;fill:var(--escoria);font-weight:600;letter-spacing:.1em}
.leg{flex:1;min-width:130px;display:grid;gap:6px}
.leg div{display:grid;grid-template-columns:12px 1fr auto;gap:8px;align-items:center;font-size:14.5px;font-weight:600}
.leg i{width:12px;height:12px;display:block}
.hb{display:grid;grid-template-columns:96px 1fr 30px;gap:10px;align-items:center;margin:9px 0;font-size:14.5px;font-weight:600}
.hb span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb div{height:14px;background:var(--palha)}.hb i{display:block;height:100%;background:var(--aco)}
.hb b{text-align:right;font-family:var(--f-m)}
.graf text{font-family:var(--f-m)}
.graf rect.b1{fill:var(--aco)}.graf rect.b2{fill:var(--brasa)}
.mini3 div{background:var(--palha)}
.mini3 span{font-family:var(--f-m);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.env .tr{background:var(--palha)}.env .tr i{background:var(--aco)}
.env .tr i.ok{background:var(--temperado)}.env .tr i.at{background:var(--faisca)}.env .tr i.cr{background:var(--brasa)}
.env .en{font-family:var(--f-b)}
/* kanban, linha do tempo, pitch */
.col{background:var(--palha)}
.kc{background:var(--card);border:1px solid var(--linha)}
.kc.at{border-left:5px solid var(--faisca)}.kc.cr{border-left:5px solid var(--brasa)}
.acao.quente{border-left:5px solid var(--brasa)}
.tli::before{background:var(--escoria)}.tli.pl::before{background:var(--faisca)}.tli.fe::before{background:var(--temperado)}
.ordem{background:var(--ferro);color:var(--cal)}
.pit .tx{background:var(--palha);border-left:4px solid var(--aco);font-family:var(--f-b)}
.pit .tx mark{background:var(--atbg);color:var(--faiscaesc);font-weight:600}
/* barra inferior: Ferro, aba ativa com o fio de Brasa no topo */
.tabbar{left:0;right:0;bottom:0;background:var(--ferro);border:0;border-top:3px solid var(--brasa);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-backdrop-filter:none;backdrop-filter:none;max-width:none;width:auto;transform:none}
@media (min-width:700px){.tabbar{left:50%;right:auto;width:min(720px,100%);transform:translateX(-50%)}}
.tabbar a{color:var(--sobre);font-family:var(--f-m);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;min-height:56px;box-shadow:none}
.tabbar a.on{background:var(--aco);color:var(--cal);box-shadow:none}
.tabbar a.on svg{color:var(--chama)}
.fab{background:var(--brasa);bottom:calc(76px + env(safe-area-inset-bottom,0px));font-family:var(--f-m);font-size:12px;letter-spacing:.08em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);height:48px}
.fab span{font-size:12px}
.savebar{bottom:calc(68px + env(safe-area-inset-bottom,0px))}
.wrap{padding-bottom:150px}
/* folha (modal) e aviso */
#modal{background:rgba(20,16,14,.6)}
.sheet{background:var(--bg);border-top:3px solid var(--brasa)}
.sheet h2{font-size:20px}
.alca i{background:var(--escoria);border-radius:0}
.toast{background:var(--ferro);color:var(--cal);font-family:var(--f-m);font-size:13px;font-weight:600;border-left:4px solid var(--brasa);text-align:left}
#toasts{bottom:calc(150px + env(safe-area-inset-bottom,0px));align-items:center}
.toast{width:fit-content;max-width:100%}
/* login */
.login h1{font-family:var(--f-d);font-weight:400;text-transform:uppercase;font-size:26px}
.login .ident svg rect{fill:var(--ferro)}
.rodape{font-family:var(--f-m);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--escoria)}
a{text-underline-offset:3px}
@media print{.capa,.tabbar,.fab,.savebar{display:none!important}.card,.lista,.kg,.pit{clip-path:none}}
/* v1.5 · PLANOS */
.pl-abas{display:flex;border:2px solid var(--ferro,#14100E);background:var(--card)}
.pl-abas button{flex:1;min-height:44px;border:0;background:transparent;font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.pl-abas button.on,.pl-tg button.on{background:#14100E;color:#F2F0ED}
.pl-bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.pl-tg{display:inline-flex;border:2px solid #14100E}
.pl-tg button{min-height:38px;padding:0 14px;border:0;background:transparent;font:600 12px/1 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);cursor:pointer}
.pl h3{margin:22px 0 8px}
.pl h4{font-family:'Archivo Black',Arial Black,sans-serif;font-weight:400;font-size:19px;line-height:1.15;margin:6px 0}
.pl-promo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:12px;padding:12px;border:2px solid #14100E;background:var(--card);font-size:14px}
.pl-promo>b,.pl .rot{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase}
.pl-promo>b{background:#14100E;color:#F2F0ED;padding:6px 8px}
.pl-vagas{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:5px;max-width:340px}
.pl-vagas i{aspect-ratio:1;border:2px solid #6E6663}
.pl-vagas i.ok{background:#D4500F;border-color:#D4500F}
.pl-vagas.peq{grid-template-columns:repeat(10,10px);gap:3px}.pl-vagas.peq i{width:10px;height:10px;border-width:1.5px}
.pl-grid{display:grid;gap:10px;margin-top:10px}
.pl-card{background:var(--card);border:1px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:8px}
.pl-card.meio{border:2px solid #14100E}
.pl-fase{font:600 11px/1 'IBM Plex Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#6E6663}
.pl-card p{margin:0;font-size:15px}
.pl-preco{margin-top:auto;padding-top:12px;border-top:1px solid var(--rule)}
.pl-preco s{display:block;font:12px 'IBM Plex Mono',monospace;color:#6E6663}
.pl-preco b{display:block;font-family:'Archivo Black',Arial Black,sans-serif;font-weight:400;font-size:26px}
.pl-preco span{font:12px 'IBM Plex Mono',monospace;color:#6E6663}
.pl-anual{margin-top:12px;background:#14100E;color:#F2F0ED;padding:16px;display:grid;gap:12px}
.pl-anual p{margin:0;color:#A79F99;font-size:14px}
.pl-anual .val{font-family:'IBM Plex Mono',monospace}.pl-anual .val b{display:block;font-size:28px;color:#F2F0ED}.pl-anual .val s,.pl-anual .val span{display:block;font-size:12px;color:#A79F99;margin-bottom:8px}
.pl-tab{margin-top:8px;border:1px solid var(--rule);background:var(--card);overflow-x:auto}
.pl-tab table{width:100%;border-collapse:collapse;font-size:14px}
.pl-tab th{background:#3A3532;color:#F2F0ED;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:9px 10px;text-align:left}
.pl-tab td{padding:9px 10px;border-bottom:1px solid var(--rule)}.pl-tab .r{text-align:right}.pl-tab td small{display:block;color:#6E6663;font-size:11px}
.pl-sob-cta{margin-top:16px;border:2px solid #D4500F;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between}.pl-sob-cta p{margin:0;font-size:14px}
.pl-pre{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px}.pl-pre span{font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;color:#6E6663;width:100%}
.pl-dur{display:flex;gap:8px}.pl-dur input{flex:1;min-width:0}.pl-dur select{flex:1.2;min-width:0}
.pl-it{background:var(--card);border:1px solid var(--rule);padding:12px;margin-top:8px}
.pl-it1{display:flex;gap:8px}.pl-it1 input{flex:1;min-width:0;font-weight:700}
.pl-it2{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:8px}
.pl-sub{margin-top:8px;font:600 13px 'IBM Plex Mono',monospace;text-align:right;color:#D4500F}
.pl-res{margin-top:14px;background:#14100E;color:#F2F0ED;padding:18px;display:grid;gap:8px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.pl-res .rot,.pl-calc .sai .rot{color:#A79F99}
.pl-res .grande,.pl-calc .grande{font-family:'Archivo Black',Arial Black,sans-serif;font-weight:400;font-size:40px;line-height:1;color:#F07A1E;word-break:break-word}
.pl-parc{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid #3A3532;padding-top:8px}.pl-parc b{font-size:20px;color:#F2F0ED}
.pl-lin{display:flex;justify-content:space-between;gap:10px;font:13px 'IBM Plex Mono',monospace;color:#CFC8C2}.pl-lin b{color:#F2F0ED;font-weight:400;text-align:right}
.pl-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pl-acts .bt{flex:1 1 140px}
.pl-hero{margin-top:14px}.pl-hero em{font-style:normal;color:#D4500F}
.pl-conta{margin-top:12px;background:#14100E;color:#CFC8C2;padding:16px;display:grid;gap:8px;font:14px 'IBM Plex Mono',monospace}.pl-conta>div{display:flex;justify-content:space-between}.pl-conta b{color:#F2F0ED;font-weight:400}.pl-conta .rot{color:#A79F99}.pl-conta .tot{border-top:1px solid #3A3532;padding-top:10px}.pl-conta .tot b{font-family:'Archivo Black',sans-serif;font-size:30px;color:#F07A1E}

.pl-calc{margin-top:10px;border:2px solid #14100E;display:grid}.pl-calc .ent{padding:16px;display:grid;gap:14px;background:var(--card)}.pl-calc .sai{padding:16px;background:#14100E;color:#F2F0ED;display:grid;gap:8px}.pl-calc .sai p{margin:0;font-size:13px;color:#A79F99}.pl-calc .ano{color:#CFC8C2;font-size:14px}
.pl-rg{display:grid;gap:4px}.pl-rg span{display:flex;justify-content:space-between;font:600 12px 'IBM Plex Mono',monospace;text-transform:uppercase}.pl-rg input{width:100%;accent-color:#D4500F}
.pl-gar{border-top:2px solid #D4500F;padding-top:8px}.pl-gar>div{padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}.pl-gar>div span{display:block;font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.pl-fund{background:#14100E;color:#CFC8C2;padding:16px}.pl-fund .rot{margin:10px 0;color:#A79F99}.pl-fund ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;font-size:14px}.pl-fund li::before{content:"";display:inline-block;width:10px;height:3px;background:#F07A1E;margin-right:8px;vertical-align:middle}.pl-fund b{color:#F2F0ED}
.pl-faq details{border-bottom:1px solid var(--rule)}.pl-faq summary{cursor:pointer;padding:12px 24px 12px 0;font-weight:700;font-size:15px;list-style:none;position:relative}.pl-faq summary::-webkit-details-marker{display:none}.pl-faq summary::after{content:"+";position:absolute;right:2px;font-family:'IBM Plex Mono',monospace}.pl-faq details[open] summary::after{content:"−"}.pl-faq p{margin:0 0 12px;font-size:14px}
.pl-fim{margin-top:22px;background:#14100E;color:#CFC8C2;padding:18px;display:grid;gap:10px;justify-items:start}.pl-fim h4{color:#F2F0ED;font-size:24px}.pl-fim p{margin:0;font-size:14px}.pl-fim .rot{color:#A79F99}
@media(min-width:720px){.pl-grid{grid-template-columns:repeat(3,1fr)}.pl-dores,.pl-cases{grid-template-columns:repeat(3,1fr)}.pl-calc{grid-template-columns:1fr 1fr}.pl-anual{grid-template-columns:1fr auto;align-items:center}}

<body>
<div id="load"></div>
<div id="app"></div>
<div id="modal"></div>
<div id="toasts"></div>
<script>
'use strict';
/* ===== FORJA · GERENCIADOR v1.0.0 — front único (HTML + JS puro) ===== */
const NAV=[['painel','Painel'],['clientes','Clientes'],['agenda','Agenda'],['pitches','Scripts'],['conteudo','Conteúdo'],['config','Config']];
const S={tok:null,d:null,f:{q:'',estagio:'',resp:'',vista:'lista',esp:''},ag:'todas',pitEtapa:null,pitCli:'',cfgLista:'estagio',cliAba:'roteiro',n:0};
const LISTAS={estagio:'Estágios do funil',origem:'Origens',tipo:'Tipos de casa',porte:'Portes',dor:'Dores declaradas',responsavel:'Responsáveis',plano:'Planos',status_impl:'Status da implantação',autorizada:'Autorização de case',atv_tipo:'Tipos de atividade',atv_status:'Status da atividade',pit_categoria:'Categorias de pitch',cont_tipo:'Tipos de conteúdo',cont_linha:'Linhas da rotação',cont_status:'Status do conteúdo',cont_gate:'Veredito do gate'};
const PROPAGA={estagio:[['CLIENTES','estagio'],['PITCHES','etapa']],origem:[['CLIENTES','origem']],tipo:[['CLIENTES','tipo']],porte:[['CLIENTES','porte']],dor:[['CLIENTES','dor']],responsavel:[['CLIENTES','responsavel']],plano:[['CLIENTES','plano']],status_impl:[['CLIENTES','status_impl']],autorizada:[['CLIENTES','autorizada_case']],atv_tipo:[['ATIVIDADES','tipo']],atv_status:[['ATIVIDADES','status']],pit_categoria:[['PITCHES','categoria']],cont_tipo:[['CONTEUDO','tipo']],cont_linha:[['CONTEUDO','linha']],cont_status:[['CONTEUDO','status']],cont_gate:[['CONTEUDO','gate']]};
const PARAMS=[['Capacidade (hipóteses a calibrar)',[['horas_semana','Horas semanais disponíveis','h'],['teto_implantacoes','Teto de implantações simultâneas','casas'],['h_raiox','Horas por Raio-X','h'],['h_implantacao','Horas por implantação ativa (semana)','h'],['h_conteudo','Horas de conteúdo (semana)','h'],['h_comercial','Horas comerciais (semana)','h'],['h_gestao','Horas de gestão (semana)','h'],['cap_faisca','Capacidade em Faísca a partir de (0 a 1)',''],['cap_brasa','Capacidade em Brasa a partir de (0 a 1)','']]],['Preços (conferir com a tabela vigente)',[['preco_raiox','Diagnóstico · preço fundador','R$'],['preco_raiox_cheio','Diagnóstico · preço cheio','R$'],['preco_start','Start','R$'],['preco_forjaos','Forja OS','R$'],['preco_mensal','Sistema Forja OS (mensal)','R$'],['fator_garantia','Fator da garantia (× valor do Raio-X)','×'],['vagas_total','Casas fundadoras · total de vagas','casas'],['vagas_fechadas','Casas fundadoras · já fechadas','casas']]],['Prazos e alertas',[['prazo_relatorio_h','Prazo do relatório do Raio-X','h'],['alerta_relatorio_h','Alerta de relatório (horas para vencer)','h'],['lead_faisca_d','Lead parado em Faísca a partir de','dias'],['lead_brasa_d','Lead parado em Brasa a partir de','dias'],['rdo_brasa_d','Casa sem RDO em Brasa a partir de','dias'],['fila_faisca_d','Fila de posts em Faísca abaixo de','dias'],['fila_brasa_d','Fila de posts em Brasa abaixo de','dias'],['cmv_faisca_pt','CMV em Faísca até (pontos acima da base)','pontos']]],['Você',[['nome_exibicao','Seu nome nos pitches',''],['whatsapp_gabriel','Seu WhatsApp (com DDD)','']]]];
const CFG_PAD={cmv_faisca_pt:'2',vagas_total:'10',vagas_fechadas:'4'};

/* ---------- utilitários ---------- */
const ev=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAPA={'Novo':'Novo lead','Conversa':'Em conversa','Raio-X agendado':'Diagnóstico agendado','Raio-X pago':'Diagnóstico pago','Proposta':'Proposta enviada','Adiado':'Em espera','Raio-X':'Diagnóstico'};
const rt=s=>Object.prototype.hasOwnProperty.call(MAPA,s)?MAPA[s]:s;
const e=s=>ev(rt(s));
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(x){return ''}};
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k)||'';if(v===null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(x){return ''}};
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
const brl=v=>'R$ '+num(v).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2});
const pad=n=>('0'+n).slice(-2);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3],12):null};
const hoje=()=>(S.d&&S.d.hoje)||iso(new Date());
const addD=(s,n)=>{const d=pd(s)||new Date();d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round(((pd(a)||0)-(pd(b)||0))/864e5);
const fd=s=>{const m=/^\d{4}-(\d{2})-(\d{2})/.exec(s||'');return m?m[2]+'/'+m[1]:'—'};
const fdl=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:'—'};
const dow=s=>['dom','seg','ter','qua','qui','sex','sáb'][(pd(s)||new Date()).getDay()];
const seg=s=>{const d=pd(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)};
const wa=(tel,txt)=>{let n=String(tel||'').replace(/\D/g,'');if(!n)return '';if(n.length<=11)n='55'+n;return 'https://wa.me/'+n+(txt?'?text='+encodeURIComponent(txt):'')};
const D=t=>S.d[t]||[];
const cfg=k=>{const r=D('CONFIG').find(x=>x.chave===k);return r&&r.valor!==''?r.valor:(CFG_PAD[k]||'')};
const cfgN=k=>num(cfg(k));
const cat=l=>D('CATEGORIAS').filter(x=>x.lista===l).sort((a,b)=>num(a.ordem)-num(b.ordem)).map(x=>x.valor);
const cli=id=>D('CLIENTES').find(c=>c.id===id);
const nomeC=c=>c?(c.nome||c.codigo):'(removido)';
const uid=()=>Math.random().toString(36).slice(2,8);

function toast(msg,err){const t=document.createElement('div');t.className='toast'+(err?' err':'');t.textContent=msg;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),err?5200:2800)}
function prog(on){S.n+=on?1:-1;const b=$('#load');b.style.width=S.n>0?'70%':'100%';if(S.n<=0){S.n=0;setTimeout(()=>{b.style.width='0'},250)}}

/* ---------- API: Apps Script (google.script.run) ou fetch (Vercel) ---------- */
const GS=()=>window.google&&google.script&&google.script.run;
const apiUrl=()=>String(window.FORJA_API_URL||ls('forja_api')||'').trim();
function call(acao,extra){
  const body=JSON.stringify(Object.assign({acao,token:S.tok},extra||{}));
  return new Promise((res,rej)=>{
    if(GS()){google.script.run.withSuccessHandler(t=>{try{res(JSON.parse(t))}catch(x){rej(new Error('Resposta inválida do servidor.'))}}).withFailureHandler(x=>rej(new Error((x&&x.message)||'Falha de conexão.'))).forjaRpc(body)}
    else{const u=apiUrl();if(!u)return rej(new Error('Endereço do servidor não configurado.'));
      fetch(u,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body}).then(r=>r.json()).then(res).catch(()=>rej(new Error('Sem conexão com o servidor.')))}
  }).then(r=>{if(r&&r.codigo==='SESSAO'){sair(true)}return r});
}
async function run(acao,extra,msgOk){
  prog(1);
  try{const r=await call(acao,extra);
    if(r.status!=='success'){toast(r.message||'Erro.',true);return null}
    if(msgOk)toast(msgOk);return r}
  catch(x){toast(x.message,true);return null}
  finally{prog(0)}
}
function merge(tabela,obj){const k=tabela==='CONFIG'?'chave':'id';const L=S.d[tabela];const i=L.findIndex(x=>x[k]===obj[k]);if(i>=0)L[i]=obj;else L.push(obj)}
async function salvar(tabela,reg,msg){const r=await run('salvar',{tabela,registro:reg},msg===undefined?'Salvo.':msg);if(!r)return null;merge(tabela,r.data);return r.data}
async function lote(tabela,regs,msg){if(!regs.length)return[];const r=await run('salvarLote',{tabela,registros:regs},msg);if(!r)return null;r.data.forEach(o=>merge(tabela,o));return r.data}
async function excluir(tabela,id,msg){const r=await run('excluir',{tabela,id},msg||'Excluído.');if(!r)return false;const k=tabela==='CONFIG'?'chave':'id';S.d[tabela]=S.d[tabela].filter(x=>x[k]!==id);if(tabela==='CLIENTES')S.d.ATIVIDADES=S.d.ATIVIDADES.filter(a=>a.cliente_id!==id);return true}
async function carregar(){const r=await run('dados');if(!r)return false;S.d=r.data;S.eu=r.data.eu||null;return true}
const souAdmin=()=>!!(S.eu&&S.eu.papel==='admin');
const primeiroNome=()=>((S.eu&&S.eu.nome)||'').trim().split(/\s+/)[0]||'';


/* ---------- cálculos do negócio ---------- */
const FIM=['Fechado','Perdido','Adiado'];
const idxE=s=>cat('estagio').indexOf(s);
const ativoLead=c=>!FIM.includes(c.estagio);
const ultimaInt=c=>c.ultima_interacao||(c.criado_em||'').slice(0,10)||hoje();
const diasSem=c=>Math.max(0,diff(hoje(),ultimaInt(c)));
const atvC=id=>D('ATIVIDADES').filter(a=>a.cliente_id===id);
function alerta(c){
  if(!ativoLead(c))return{n:0,t:''};
  const d=diasSem(c);let n=0,t='';
  if(d>=cfgN('lead_brasa_d')){n=2;t=d+' dias parado'}else if(d>=cfgN('lead_faisca_d')){n=1;t=d+' dias sem contato'}
  if(!c.proxima_acao||!c.data_proxima){if(n<1)n=1;t=t||'sem próxima ação'}
  else if(c.data_proxima<hoje()){n=2;t='próxima ação vencida'}
  return{n,t};
}
function alcancou(c,passo){
  const A=atvC(c.id);const i=idxE(passo);
  if(i>=0&&!['Perdido','Adiado'].includes(c.estagio)&&idxE(c.estagio)>=i)return true;
  const ev={'Raio-X agendado':a=>a.tipo==='Raio-X'&&a.status!=='Cancelada','Raio-X pago':a=>a.tipo==='Raio-X'&&a.status==='Feita'&&num(a.valor)>0,'Relatório entregue':a=>a.tipo==='Relatório'&&a.status==='Feita','Proposta':a=>a.tipo==='Proposta'&&a.status==='Feita','Fechado':a=>a.tipo==='Fechamento'&&a.status==='Feita'}[passo];
  return !!(ev&&A.some(ev));
}
function relatorios(){
  const out=[];const H=cfgN('prazo_relatorio_h')||48;
  D('CLIENTES').forEach(c=>{
    const A=atvC(c.id);
    A.filter(a=>a.tipo==='Raio-X'&&a.status==='Feita').forEach(v=>{
      const ini=(pd(v.data)||new Date());const hh=/^(\d{2}):(\d{2})/.exec(v.hora||'');ini.setHours(hh?+hh[1]:12,hh?+hh[2]:0,0,0);
      const lim=new Date(ini.getTime()+H*36e5);
      const ent=A.filter(a=>a.tipo==='Relatório'&&a.status==='Feita'&&a.data>=v.data).sort((x,y)=>x.data<y.data?-1:1)[0];
      let entDt=null;if(ent){entDt=pd(ent.data);const h2=/^(\d{2}):(\d{2})/.exec(ent.hora||'');entDt.setHours(h2?+h2[1]:23,h2?+h2[2]:59,0,0)}
      out.push({c,lim,ent:!!ent,noPrazo:ent?entDt<=lim:null,horas:ent?null:(lim-new Date(hoje()+'T'+(new Date().toTimeString().slice(0,5))))/36e5})
    });
  });return out;
}
function horasRestantes(r){const agora=new Date();const h=(r.lim-agora)/36e5;return h}
function semaforoCap(){
  const sem=seg(hoje()),fim=addD(sem,6);
  const rx=D('ATIVIDADES').filter(a=>a.tipo==='Raio-X'&&a.status!=='Cancelada'&&a.data>=sem&&a.data<=fim).length;
  const ativas=D('CLIENTES').filter(c=>c.status_impl==='Ativa').length;
  const h=rx*cfgN('h_raiox')+ativas*cfgN('h_implantacao')+cfgN('h_conteudo')+cfgN('h_comercial')+cfgN('h_gestao');
  const cap=cfgN('horas_semana')||1;return{h,pct:h/cap,rx,ativas};
}
function indicadores(){
  const C=D('CLIENTES'),A=D('ATIVIDADES'),T=hoje();
  const leads=C.filter(ativoLead);
  const par=leads.filter(c=>alerta(c).n>0);const parBr=par.some(c=>alerta(c).n===2);
  const rxAg=A.filter(a=>a.tipo==='Raio-X'&&a.status==='Planejada').length;
  const rxPg=C.filter(c=>alcancou(c,'Raio-X pago')).length;
  const rel=relatorios();const aberto=rel.filter(r=>!r.ent);
  const venc=aberto.filter(r=>horasRestantes(r)<=cfgN('alerta_relatorio_h'));
  const entreg=rel.filter(r=>r.ent);const noPr=entreg.filter(r=>r.noPrazo).length;
  const prop=C.filter(c=>alcancou(c,'Proposta')).length;
  const fech=C.filter(c=>alcancou(c,'Fechado')).length;
  const impl=C.filter(c=>c.status_impl==='Ativa');
  const teto=cfgN('teto_implantacoes');
  const pct=impl.length?Math.round(impl.reduce((s,c)=>s+['p_produto','p_custo','p_gente','p_conduta','p_rotina'].reduce((x,k)=>x+num(c[k]),0)/5,0)/impl.length):null;
  const semRdo=impl.filter(c=>{const r=atvC(c.id).filter(a=>a.tipo==='RDO'&&a.status==='Feita').map(a=>a.data).sort().pop();return !r||diff(T,r)>=cfgN('rdo_brasa_d')});
  const risco=impl.filter(c=>c.economia_mes!==''&&c.economia_mes!=null&&num(c.valor_rx||cfg('preco_raiox'))>0&&num(c.economia_mes)<cfgN('fator_garantia')*num(c.valor_rx||cfg('preco_raiox')));
  const eco=C.reduce((s,c)=>s+num(c.economia_mes),0);
  const cap=semaforoCap();
  const sc=(v,f,b)=>v>=b?'cr':v>=f?'at':'ok';
  return[
   {k:'ativos',l:'Leads ativos',v:leads.length,st:'in',go:'ativos'},
   {k:'parados',l:'Leads parados ou sem próxima ação',v:par.length,st:par.length?(parBr?'cr':'at'):'ok',go:'parados'},
   {k:'rxag',l:'Diagnósticos agendados',v:rxAg,st:'in',go:'agenda'},
   {k:'rxpg',l:'Diagnósticos pagos',v:rxPg,st:'in'},
   {k:'venc',l:'Relatórios a vencer em até '+cfgN('alerta_relatorio_h')+' h ou vencidos',v:venc.length,st:venc.length?(venc.some(r=>horasRestantes(r)<=0)?'cr':'at'):'ok',go:'agenda'},
   {k:'noprazo',l:'Relatórios no prazo de '+cfgN('prazo_relatorio_h')+' h',v:entreg.length?Math.round(noPr/entreg.length*100)+'%':'—',st:'in'},
   {k:'prop',l:'Propostas enviadas',v:prop,st:'in'},
   {k:'fech',l:'Fechamentos',v:fech,st:'in',go:'fechados'},
   {k:'conv',l:'Conversão diagnóstico → fechamento',v:rxPg?Math.round(fech/rxPg*100)+'%':'—',st:'in'},
   {k:'impl',l:'Implantações ativas (teto '+teto+')',v:impl.length,st:teto&&impl.length>teto?'cr':(teto&&impl.length===teto?'at':'ok'),go:'impl'},
   {k:'pct',l:'% médio pronto das casas ativas',v:pct==null?'—':pct+'%',st:'in',go:'impl'},
   {k:'rdo',l:'Casas ativas sem RDO em dia',v:semRdo.length,st:semRdo.length?'cr':'ok',go:'impl'},
   {k:'gar',l:'Garantia em risco (casas)',v:risco.length,st:risco.length?'cr':'ok',go:'impl'},
   {k:'eco',l:'Economia medida por mês',v:brl(eco),st:'in'},
   {k:'carga',l:'Carga semanal estimada (h)',v:cap.h.toLocaleString('pt-BR',{maximumFractionDigits:1})+' / '+cfgN('horas_semana'),st:cap.pct>=cfgN('cap_brasa')?'cr':(cap.pct>=cfgN('cap_faisca')?'at':'ok')}
  ];
}
const ST={ok:'No padrão',at:'Atenção',cr:'Crítico',in:'Info'};

/* ---------- formulários genéricos ---------- */
function campo(f,v){
  v=v==null?'':v;const id='f_'+f.k;const ro=f.ro?' readonly':'';
  let inp;
  if(f.t==='area')inp=`<textarea name="${f.k}" id="${id}"${ro}>${e(v)}</textarea>`;
  else if(f.t==='sel'){const o=(typeof f.o==='function'?f.o():f.o)||[];const ops=o.map(x=>Array.isArray(x)?x:[x,x]);const tem=ops.some(x=>x[0]===v);
    inp=`<select name="${f.k}" id="${id}"><option value=""></option>${ops.map(x=>`<option value="${ev(x[0])}"${x[0]===v?' selected':''}>${e(x[1])}</option>`).join('')}${!tem&&v?`<option value="${ev(v)}" selected>${e(v)}</option>`:''}</select>`}
  else inp=`<input name="${f.k}" id="${id}" type="${f.t==='num'?'text':f.t||'text'}"${f.t==='num'?' inputmode="decimal"':''}${f.t==='tel'?' inputmode="tel"':''} value="${ev(v)}"${ro}${f.ph?` placeholder="${ev(f.ph)}"`:''}>`;
  return `<label class="f" data-k="${f.k}">${e(f.l)}${f.req?' *':''}${inp}<span class="msg"></span>${f.h?`<span class="nota" style="text-transform:none;font-family:var(--serif)">${e(f.h)}</span>`:''}</label>`;
}
function lerForm(form,fields){
  const out={};let ok=true;let first=null;
  fields.forEach(f=>{
    const el=form.querySelector('[name="'+f.k+'"]');if(!el)return;
    let v=el.value.trim();let msg='';
    if(f.req&&!v)msg='Preencha este campo.';
    else if(v&&f.t==='num'){if(!isFinite(parseFloat(v.replace(',','.')))||!/^-?[\d.,]+$/.test(v))msg='Use só números.';else v=String(num(v))}
    else if(v&&f.t==='date'&&!/^\d{4}-\d{2}-\d{2}$/.test(v))msg='Data inválida.';
    else if(v&&f.t==='tel'&&v.replace(/\D/g,'').length<10)msg='Telefone com DDD (10 ou 11 dígitos).';
    const lb=form.querySelector('[data-k="'+f.k+'"]');
    if(lb){lb.classList.toggle('erro',!!msg);lb.querySelector('.msg').textContent=msg}
    if(msg){ok=false;if(!first)first=el}
    out[f.k]=v;
  });
  if(first)first.focus();
  return ok?out:null;
}

function acoesHoje(){
  const T=hoje(),it=[];
  D('ATIVIDADES').filter(a=>a.status==='Planejada'&&a.data<=T).sort((a,b)=>a.data<b.data?-1:1).forEach(a=>it.push({n:a.data<T?2:1,t:a.tipo+(a.resumo?' · '+a.resumo:''),c:cli(a.cliente_id),d:a.data,atv:a}));
  D('CLIENTES').filter(ativoLead).forEach(c=>{
    if(c.proxima_acao&&c.data_proxima&&c.data_proxima<=T&&!D('ATIVIDADES').some(a=>a.cliente_id===c.id&&a.status==='Planejada'&&a.data<=T&&a.resumo===c.proxima_acao))it.push({n:c.data_proxima<T?2:1,t:'Próxima ação: '+c.proxima_acao,c,d:c.data_proxima});
    else if(!c.proxima_acao&&alerta(c).n)it.push({n:1,t:'Definir próxima ação ('+alerta(c).t+')',c,d:''});
  });
  relatorios().filter(r=>!r.ent&&horasRestantes(r)<=cfgN('alerta_relatorio_h')).forEach(r=>it.push({n:horasRestantes(r)<=0?2:1,t:'Relatório do diagnóstico: '+(horasRestantes(r)<=0?'VENCIDO':'vence em '+Math.max(0,Math.round(horasRestantes(r)))+' h'),c:r.c,d:''}));
  return it.sort((a,b)=>b.n-a.n);
}
function chBarras(vals,labs){
  const W=320,pl=6,bw=26,gap=(W-pl*2-bw*vals.length)/Math.max(1,vals.length-1),mx=Math.max(1,...vals);
  return `<svg class="graf" viewBox="0 0 ${W} 126" role="img" aria-label="Conversas por semana">`+vals.map((v,i)=>{const x=pl+i*(bw+gap),h=Math.round(v/mx*76),y=98-h;return `<rect class="${i===vals.length-1?'b2':'b1'}" x="${x.toFixed(1)}" y="${y}" width="${bw}" height="${Math.max(h,3)}" rx="1"/><text class="vv" x="${(x+bw/2).toFixed(1)}" y="${y-5}" text-anchor="middle">${v}</text><text x="${(x+bw/2).toFixed(1)}" y="116" text-anchor="middle">${labs[i]}</text>`}).join('')+'</svg>';
}
function donut(parts){
  const tot=parts.reduce((x,p)=>x+p.v,0)||1,R=46,C=2*Math.PI*R;let off=0;
  const arcs=parts.filter(p=>p.v>0).map(p=>{const l=p.v/tot*C;const el=`<circle cx="60" cy="60" r="${R}" fill="none" stroke="${p.c}" stroke-width="18" stroke-dasharray="${l.toFixed(2)} ${(C-l).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 60 60)"/>`;off+=l;return el}).join('');
  return `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="Leads por estágio"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--surf)" stroke-width="18"/>${arcs}<text x="60" y="58" text-anchor="middle" class="dn">${tot===1&&!parts.some(p=>p.v)?0:tot}</text><text x="60" y="73" text-anchor="middle" class="dl">leads</text></svg>`;
}
function spark(vals){
  const W=120,H=34,mx=Math.max(1,...vals),st=W/Math.max(1,vals.length-1);
  const pts=vals.map((v,i)=>(i*st).toFixed(1)+','+(H-3-v/mx*(H-8)).toFixed(1));
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts.join(' ')}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function smNovo(base){
  const i=plIdx();
  const it=(n,tp,v,q,un)=>({n,tp,v:String(v),q:q==null?'':String(q),un:un||'mes'});
  const B={
    branco:{nome:'Proposta sob medida',dur:'3',un:'mes',itens:[it('Diagnóstico','u',plP('raiox'),1),it('Implantação','u',0,1),it('Acompanhamento','r',plP('sem'),'','mes')]},
    start:{nome:'Start',dur:'1',un:'mes',itens:[it('Diagnóstico','u',plP('raiox'),1),it('Implantação Start','u',plP('start'),1)]},
    os:{nome:'Forja OS',dur:'45',un:'dia',itens:[it('Diagnóstico','u',plP('raiox'),1),it('Implantação Forja OS','u',plP('os'),1)]},
    aRest:{nome:'Plano anual · restaurante',dur:'12',un:'mes',itens:[it('Diagnóstico (incluído)','u',0,1),it('Implantação Forja OS (−20%)','u',Math.round(plP('os')*0.8),1),it('Forja OS + visita semanal','r',plP('sem'),10,'mes'),it('Treino da equipe (bônus)','u',0,1)]},
    aMarm:{nome:'Plano anual · marmitaria',dur:'12',un:'mes',itens:[it('Diagnóstico (incluído)','u',0,1),it('Implantação Start (−20%)','u',Math.round(plP('start')*0.8),1),it('Forja OS + visita semanal','r',plP('sem'),11,'mes'),it('Treino da equipe (bônus)','u',0,1)]}
  }[base||'branco'];
  if(B.un==='dia'){B.dur='1.5';B.un='mes'}
  return Object.assign({id:'',cli:'',desc:'0',descV:'0',ent:'0',np:'1',freq:'mes',obs:''},B);
}
function smCalc(m){
  const dur=num(m.dur),dd=dur*PL_DIAS[m.un];
  let unico=0,rec=0;
  const L=m.itens.map(x=>{
    let n,sub;
    if(x.tp==='u'){n=x.q===''?1:num(x.q);sub=num(x.v)*n;unico+=sub}
    else{n=x.q===''?Math.round(dd/PL_DIAS[x.un]*100)/100:num(x.q);sub=num(x.v)*n;rec+=sub}
    return {n,sub};
  });
  const bruto=unico+rec,liq=bruto*(1-Math.min(100,num(m.desc))/100),vista=liq*(1-Math.min(100,num(m.descV))/100);
  const ent=liq*Math.min(100,num(m.ent))/100,np=Math.max(1,Math.round(num(m.np))||1),parc=(liq-ent)/np;
  return {dur,dd,L,unico,rec,bruto,liq,vista,ent,np,parc,mes:dd>0?liq/(dd/PL_DIAS.mes):0,sem:dd>0?liq/(dd/7):0};
}
const smDurTxt=m=>{const d=num(m.dur);return (Math.round(d*100)/100).toString().replace('.',',')+' '+PL_UN[m.un][d===1?0:1]};
function smTexto(m){
  const c=smCalc(m),cl=cli(m.cli);
  const l=['*Proposta Forja'+(cl?' · '+nomeC(cl):'')+'*',m.nome?m.nome:'','','Duração: '+smDurTxt(m),'','*O que entra*'];
  m.itens.forEach((x,i)=>{const r=c.L[i];l.push('• '+x.n+' — '+(x.tp==='u'?(r.n!==1?r.n+' × '+plR2(num(x.v)):plR2(num(x.v))):plR2(num(x.v))+' '+PL_UN[x.un][2]+' × '+(Math.round(r.n*100)/100).toString().replace('.',',')+' = '+plR2(r.sub)))});
  l.push('');if(num(m.desc)>0)l.push('Subtotal: '+plR2(c.bruto),'Desconto '+num(m.desc)+'%: −'+plR2(c.bruto-c.liq));
  l.push('*Total: '+plR2(c.liq)+'*');
  const fq={sem:'semanais',mes:'mensais',ano:'anuais'}[m.freq];
  if(c.np>1||c.ent>0){l.push((c.ent>0?'Entrada de '+plR2(c.ent)+' + ':'')+c.np+' parcelas '+fq+' de '+plR2(c.parc))}
  if(num(m.descV)>0)l.push('À vista: '+plR2(c.vista)+' ('+num(m.descV)+'% a menos)');
  if(m.obs)l.push('',m.obs);
  l.push('','Forja · padrão para restaurantes');
  return l.join('\n');
}

  const rg=(k,l,mn,mx,st,fmt)=>`<label class="pl-rg"><span>${l}<output data-o="${k}">${fmt(C[k])}</output></span><input type="range" data-calc="${k}" min="${mn}" max="${mx}" step="${st}" value="${C[k]}"></label>`;
  return `<div class="pl-hero"><span class="pl-fase">Para restaurantes e marmitarias</span><h4>Sua cozinha não tem problema de receita. Tem problema de <em>repetição.</em></h4><p>A gente pesa o que sai do prato, mostra em reais quanto se perde e instala o padrão que fica.</p>
  <div class="pl-conta"><span class="rot">A conta que ninguém faz</span><div><span>Carne a mais por prato</span><b>20 g</b></div><div><span>Pratos por dia</span><b>150</b></div><div><span>Preço da carne</span><b>R$ 45/kg</b></div><div class="tot"><span>POR MÊS</span><b class="mono">R$ 4.050</b></div></div></div>
  <h3>As dores</h3><div class="pl-dores"><div><b>Cada um serve de um jeito</b><p>A porção muda com quem está na chapa.</p></div><div><b>Ninguém sabe o custo do prato</b><p>O preço foi chutado e o fornecedor já subiu três vezes.</p></div><div><b>O dono é o sistema</b><p>Se ele sai da cozinha, o padrão sai junto.</p></div></div>
  <h3>Calculadora do cliente</h3><div class="pl-tg" style="margin-top:8px"><button type="button" data-act="plCm" data-v="porcao" class="${m==='porcao'?'on':''}">Pela porção</button><button type="button" data-act="plCm" data-v="cmv" class="${m==='cmv'?'on':''}">Pelo CMV</button></div>
  <div class="pl-calc"><div class="ent">${m==='porcao'?rg('pr','Pratos ou marmitas por dia',20,800,10,v=>v)+rg('g','Gramas a mais por prato',5,80,5,v=>v+' g')+rg('kg','Preço do item por kg',5,150,1,v=>'R$ '+v):rg('fat','Faturamento por mês',20000,800000,5000,plR)+rg('hj','CMV hoje',20,55,1,v=>v+'%')+rg('meta','Meta da casa',18,45,1,v=>v+'%')}</div>
  <div class="sai" aria-live="polite"><span class="rot" data-o="tit">${tit}</span><b class="grande mono" data-o="mes">${plR(mes)}</b><span class="ano mono" data-o="ano">${plR(mes*12)} por ano</span><p data-o="nota">${nota}</p></div></div>
  <h3>Resultados</h3><div class="pl-cases"><div><span class="rot">Restaurante · R$ 250 mil/mês</span><b>−3 pts</b><p>de CMV em um mês. Cerca de R$ 7.500 por mês de volta ao caixa.</p><small>Período e base: [CAMPO A PREENCHER]</small></div><div><span class="rot">Buffet</span><b><s>47%</s> 28%</b><p>de CMV. Porção, reposição e sobra passaram a ter número.</p><small>Período e base: [CAMPO A PREENCHER]</small></div><div><span class="rot">Lanchonete</span><b><s>35%</s> 27%</b><p>de CMV com o mesmo cardápio. A diferença estava na montagem e na compra.</p><small>Período e base: [CAMPO A PREENCHER]</small></div></div>
  <h3>Garantia</h3><div class="pl-gar"><p><b>Risco zero, com uma condição: a casa deixa mudar.</b></p><div><span>Diagnóstico</span>Se não mostrarmos pelo menos R$ 1.000/mês de vazamento, devolvemos o valor do diagnóstico.</div><div><span>Implantação</span>Entrega no prazo. 90 dias depois, se o vazamento medido não cair pela metade, voltamos toda semana sem cobrar até cair.</div><div><span>Todo mês</span>Visita perdida é reposta ou sai da mensalidade. CMV fora da meta 2 meses seguidos: o mês seguinte é por nossa conta.</div>
  <p class="nota"><b>Os 5 compromissos da casa:</b> notas e vendas toda segunda · contagem semanal no app · alguém que decide em cada visita · ações combinadas feitas · nenhuma mudança de ficha, porção ou fornecedor sem registro. A casa pode dizer não a qualquer mudança; só não dá para dizer não e cobrar o resultado dela. O índice de compromisso aparece toda semana no relatório.</p></div>
  <h3>O que o cliente recebe · Forja OS</h3><div class="lista">${[['Produto','Ficha técnica e porção padrão na parede.'],['Custo','Custo real de cada prato e alerta de preço do fornecedor.'],['Estoque','O que tem, o que está baixo e o pedido pronto por fornecedor.'],['Equipe','Treino na bancada e checklist de abertura e fechamento.'],['Dono','Um painel no celular com tudo isso, sem montar planilha.']].map(r=>`<div class="row"><div><div class="nm">${r[0]}</div><div class="sb">${r[1]}</div></div></div>`).join('')}</div>
  <h3>Casas fundadoras</h3><div class="pl-fund">${plVagas()}<p class="rot">${plFech()} fechadas · ${plAbertas()} abertas · na ${plVTot()+1}ª casa o preço sobe 20%</p><ul><li><b>Preço de fundadora.</b> A tabela de hoje, que sobe 20% depois da ${plVTot()}ª casa.</li><li><b>Assinatura travada por 24 meses.</b> O valor não sobe, nem depois do reajuste.</li><li><b>App Forja OS sem custo extra</b> por 12 meses quando for lançado.</li><li><b>Prioridade de agenda</b> e voz no que o app vai ter.</li><li><b>Selo Casa Fundadora</b> na parede da cozinha.</li><li>Em troca, a casa autoriza mostrar os números dela sem nome, só setor e porte.</li></ul></div>
  <h3>Perguntas de quem está cansado</h3><div class="pl-faq">${PL_FQ.map(q=>`<details><summary>${e(q[0])}</summary><p>${e(q[1])}</p></details>`).join('')}</div>
  <div class="pl-fim"><h4>Me chama para jantar na sua cozinha.</h4><p>Uma conversa de 15 minutos no WhatsApp e dizemos se o diagnóstico faz sentido. Se não fizer, falamos.</p><a class="bt pri" target="_blank" rel="noopener" href="${ev(plZap('Oi, Gabriel! Vi a página da Forja e quero entender o diagnóstico para a minha cozinha.'))}">Chamar no WhatsApp</a><p class="rot">(12) 99231-8239 · @somosforja.br</p></div>`;
}
function plCalcAtual(){
  const C=S.pl.c,m=S.pl.cm;let tit,mes,nota;
  if(m==='porcao'){mes=C.pr*C.g/1000*C.kg*30;tit='Vai embora por mês';nota='Estimativa de um item só. O número real sai pesado na bancada.'}
  else{const dif=Math.max(0,C.hj-C.meta);mes=C.fat*dif/100;tit=dif?'Acima da meta, por mês':'Na meta';nota=dif?'Cada ponto de CMV vale '+plR(C.fat/100)+' por mês. Recuperando só um terço, sobram '+plR(mes/3)+'.':'Bom sinal. O diagnóstico confere se esse número é real.'}
  const set=(k,t)=>{const el=document.querySelector('[data-o="'+k+'"]');if(el)el.textContent=t};
  set('tit',tit);set('mes',plR(mes));set('ano',plR(mes*12)+' por ano');set('nota',nota);
  set('pr',C.pr);set('g',C.g+' g');set('kg','R$ '+C.kg);set('fat',plR(C.fat));set('hj',C.hj+'%');set('meta',C.meta+'%');
}
Object.assign(A,{
  plAba:el=>{S.pl.aba=el.dataset.v;rota()},
  plTab:el=>{S.pl.tab=el.dataset.v;rota()},
  plSeg:el=>{S.pl.seg=el.dataset.v;rota()},
  plCm:el=>{S.pl.cm=el.dataset.v;rota()},
  smPreset:el=>{S.sm=smNovo(el.dataset.v);S.pl.aba='sob';if(location.hash!=='#/planos')location.hash='#/planos';else rota();window.scrollTo(0,0)},
  smAdd:()=>{S.sm.itens.push({n:'Novo item',tp:'u',v:'0',q:'',un:'mes'});smRender()},
  smDel:el=>{S.sm.itens.splice(+el.dataset.i,1);smRender()},
  smAbrir:el=>{const x=D('CONFIG').find(r=>r.chave==='prop_'+el.dataset.id);if(!x)return;try{S.sm=JSON.parse(x.valor)}catch(_){return}smRender();window.scrollTo(0,0)},
  smSalvar:async()=>{
    const m=S.sm;if(!String(m.nome).trim()){toast('Dê um nome à proposta.',true);return}
    if(!m.id)m.id=uid();m.at=hoje();
    const r=await salvar('CONFIG',{chave:'prop_'+m.id,valor:JSON.stringify(m)},'Proposta salva.');
    if(r){S.pl.aba='sob';rota()}
  },
  smExcluir:()=>{const id=S.sm.id;confirma('Excluir proposta?','Esta proposta sai da lista.','Excluir',async()=>{if(await excluir('CONFIG','prop_'+id,'Proposta excluída.')){S.sm=smNovo('branco');rota()}},true)},
  smCopiar:async()=>{const t=smTexto(S.sm);try{await navigator.clipboard.writeText(t);toast('Texto copiado.')}catch(_){toast('Não foi possível copiar.',true)}},
  smZap:()=>{const c=cli(S.sm.cli);window.open(wa(c&&c.whatsapp,smTexto(S.sm))||('https://wa.me/?text='+encodeURIComponent(smTexto(S.sm))),'_blank','noopener')}
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.hot){S.pl.h[t.dataset.hot]=num(t.value);plHotAtual();return}
  if(t.dataset&&t.dataset.calc){S.pl.c[t.dataset.calc]=num(t.value);plCalcAtual();return}
  if(t.dataset&&t.dataset.sm&&!/^(SELECT)$/.test(t.tagName))smCampo(t);
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.sm&&t.tagName==='SELECT'){smCampo(t);if(t.dataset.sm==='tp'||(t.dataset.sm==='un'&&t.dataset.i!==undefined))smRender()}
});
function smCampo(t){
  const k=t.dataset.sm,m=S.sm;if(!m)return;
  if(t.dataset.i!==undefined){const x=m.itens[+t.dataset.i];if(!x)return;x[k]=t.value}
  else m[k]=t.value;
  smAtual();
}

/* ---------- usuários (administrador) ---------- */
function vUsuarios(){
  S.tit='Usuários';S.kk='Acesso ao app';
  if(!souAdmin())return `<p class="nota">Só o administrador gerencia usuários.</p>`;
  if(!S.us){run('usuarios').then(r=>{if(r){S.us=r.data;if(location.hash==='#/usuarios')rota()}});return `<p class="nota">Carregando…</p>`}
  return `<section><a class="nota" href="#/mais" style="color:var(--acento);font-weight:700;text-decoration:none">‹ Mais</a>
  <p class="nota" style="font-size:15px;margin:10px 0 14px">Cada pessoa entra com o próprio e-mail e senha. A senha nunca fica gravada: só o hash. Para quem esqueceu, redefina aqui.</p>
  <button class="bt pri" data-act="novoUsuario" style="margin-bottom:14px">+ Novo usuário</button>
  <div class="lista">${S.us.map(u=>`<div class="row lk" data-act="editarUsuario" data-id="${ev(u.id)}"><div class="av">${e(ini({nome:u.nome}))}<i class="${u.ativo==='Sim'?'ok':'cr'}"></i></div><div style="min-width:0"><div class="nm">${e(u.nome)}</div><div class="sb" style="overflow-wrap:anywhere">${e(u.email)}</div><div class="sb">${u.ultimo_login?'Último acesso '+e(fdl(u.ultimo_login.slice(0,10))):'Nunca entrou'}</div></div><div class="rt"><span class="chip ${u.papel==='admin'?'sf':''}">${u.papel==='admin'?'Administrador':'Consultor'}</span>${u.ativo!=='Sim'?'<span class="chip cr">Desativado</span>':''}</div></div>`).join('')}</div></section>`;
}
function modalUsuario(u){
  const novo=!u;u=u||{papel:'consultor',ativo:'Sim'};
  const F=[{k:'nome',l:'Nome',req:1},{k:'email',l:'E-mail',t:'email',req:1,h:'É com ele que a pessoa entra.'},{k:'papel',l:'Papel',t:'sel',o:[['consultor','Consultor · usa o app'],['admin','Administrador · também gerencia usuários']]},{k:'ativo',l:'Acesso',t:'sel',o:[['Sim','Ativo'],['Não','Desativado']]},{k:'senha',l:novo?'Senha (mín. 8 caracteres)':'Nova senha (deixe vazio para manter)',t:'password',req:novo?1:0,h:novo?'Combine com a pessoa como ela recebe a senha. Ela pode trocar depois, em Mais.':'Se preencher, a pessoa precisa entrar de novo.'}];
  formModal(novo?'Novo usuário':'Editar usuário',F,u,async v=>{
    const form=$('#mf');const senha=form.querySelector('[name=senha]').value;
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email)){const lb=form.querySelector('[data-k=email]');lb.classList.add('erro');lb.querySelector('.msg').textContent='E-mail inválido.';return false}
    if(senha&&senha.length<8){const lb=form.querySelector('[data-k=senha]');lb.classList.add('erro');lb.querySelector('.msg').textContent='Mínimo 8 caracteres.';return false}
    const r=await run('usuarioSalvar',{registro:Object.assign({},u.id?{id:u.id}:{},{nome:v.nome,email:v.email,papel:v.papel||'consultor',ativo:v.ativo||'Sim',senha})},novo?'Usuário criado.':'Usuário atualizado.');
    if(!r)return false;S.us=null;if(S.eu&&r.data.id===S.eu.id)S.eu=Object.assign(S.eu,r.data);rota();
  });
}
function modalMinhaSenha(){
  abrirModal(`<h2>Trocar minha senha</h2><form id="ms" novalidate><div class="grade">
  <label class="f">Senha atual<input name="atual" type="password" autocomplete="current-password"></label>
  <label class="f">Nova senha (mín. 8 caracteres)<input name="nova" type="password" autocomplete="new-password"></label>
  <label class="f">Repita a nova senha<input name="rep" type="password" autocomplete="new-password"></label></div>
  <div class="macts"><button type="button" class="bt sec" data-act="fechar">Cancelar</button><button class="bt pri" type="submit">Trocar</button></div></form>`);
  $('#ms').addEventListener('submit',async ev=>{ev.preventDefault();const f=ev.target;const atual=f.atual.value,nova=f.nova.value,rep=f.rep.value;
    if(!atual){toast('Digite a senha atual.',true);return}
    if(nova.length<8){toast('A nova senha precisa de pelo menos 8 caracteres.',true);return}
    if(nova!==rep){toast('As duas senhas novas não são iguais.',true);return}
    const r=await run('senhaPropria',{atual,nova},'Senha trocada.');if(!r)return;
    S.tok=r.data.token;ss('forja_tok',S.tok);fechar()});
}

/* ---------- salvar cliente e ações novas ---------- */
async function salvarCliente(form){
  const id=form.dataset.id;const fields=FCLI().concat(FIMPL());const v=lerForm(form,fields);
  if(!v){const bad=form.querySelector('label.erro');const pn=bad&&bad.closest('[data-pan]');if(pn)A.cliAba({dataset:{v:pn.dataset.pan}});if(bad){const i=bad.querySelector('input,select,textarea');if(i)i.focus()}toast('Corrija os campos em vermelho.',true);return}
  ['p_produto','p_custo','p_gente','p_conduta','p_rotina'].forEach(k=>{if(v[k]!==''&&(num(v[k])<0||num(v[k])>100))v[k]=String(Math.max(0,Math.min(100,num(v[k]))))});
  const base=id?cli(id):{};const r=await salvar('CLIENTES',Object.assign({},base,v,id?{id}:{}));
  if(r){if(!id){S.cliAba='roteiro';location.hash='#/cliente/'+r.id}else rota()}
}
Object.assign(A,{
  cliAba:el=>{const v=el.dataset.v;S.cliAba=v;document.querySelectorAll('[data-pan]').forEach(p=>{p.hidden=p.dataset.pan!==v});document.querySelectorAll('.pags button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===v)));const sb=$('#sb');if(sb)sb.hidden=!['dados','impl'].includes(v)},
  verTodos:()=>{S.verTodos=!S.verTodos;rota()},
  verSenha:el=>{const i=el.closest('label').querySelector('input');const m=i.type==='password';i.type=m?'text':'password';el.textContent=m?'Ocultar':'Mostrar'},
  novoUsuario:()=>modalUsuario(null),editarUsuario:el=>modalUsuario((S.us||[]).find(u=>u.id===el.dataset.id)),minhaSenha:()=>modalMinhaSenha(),
  tema:el=>{ls('forja_tema',el.dataset.v==='auto'?null:el.dataset.v);aplicaTema();rota()},
  fab:()=>abrirModal(`<h2>Registrar</h2><div class="acoes-rap"><button class="acao quente" data-act="fabNovo" data-v="cliente"><b>Novo cliente</b><span>Lead ou casa</span></button><button class="acao" data-act="fabNovo" data-v="atv"><b>Atividade</b><span>Visita, diagnóstico, tarefa</span></button><button class="acao" data-act="fabNovo" data-v="pit"><b>Script</b><span>Roteiro de abordagem</span></button><button class="acao" data-act="fabNovo" data-v="con"><b>Peça de conteúdo</b><span>Post, story, reel</span></button></div>`),
  fabNovo:el=>{fechar();const v=el.dataset.v;if(v==='cliente')location.hash='#/cliente/novo';else if(v==='atv')modalAtv(null);else if(v==='pit')modalPit();else modalCon()}
});
aplicaTema();

/* ---------- início ---------- */
(function ini(){
  if('serviceWorker' in navigator&&!GS()&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  S.tok=ss('forja_tok')||null;
  if(S.tok){carregar().then(ok=>{if(!ok)S.tok=null;rota()})}else rota();
})();
